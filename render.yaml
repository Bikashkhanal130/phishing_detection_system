# render.yaml  --  Render Blueprint
# Put this file at the ROOT of your GitHub repo (next to the backend/ and android/ folders).
# In Render, choose "New +" -> "Blueprint", point it at your repo, and it will create
# BOTH the web service and the PostgreSQL database automatically.

services:
  - type: web
    name: phishing-detector-api
    runtime: python
    plan: free
    rootDir: backend                       # our Python code lives in /backend
    buildCommand: "pip install -r requirements.txt && python train_model.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true                # Render generates a strong random secret
      - key: DEV_MODE
        value: "1"                         # OTP printed to Render Logs; set to 0 after SMTP is configured
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false                        # you fill this in the dashboard (your Gmail)
      - key: SMTP_PASSWORD
        sync: false                        # you fill this in the dashboard (Gmail App Password)
      - key: DATABASE_URL
        fromDatabase:
          name: phishing-db
          property: connectionString       # auto-wires the DB URL into the app

databases:
  - name: phishing-db
    plan: free
